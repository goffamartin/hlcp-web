# Install in /etc/nginx/sites-available/hlcp-web after the certificate exists.
# Replace CLIENT_LAN_CIDR and CLIENT_VPN_CIDR before nginx -t.
# Unknown/default virtual hosts and unrelated services are not changed here.
map $http_upgrade $hlcp_web_connection {
    default upgrade;
    '' close;
}

server {
    listen 443 ssl;
    server_name hlcp.home.goffa.cz;
    if ($host != hlcp.home.goffa.cz) { return 444; }
    ssl_certificate /etc/letsencrypt/live/hlcp.home.goffa.cz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hlcp.home.goffa.cz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    allow CLIENT_LAN_CIDR;
    allow CLIENT_VPN_CIDR;
    allow 127.0.0.1;
    deny all;
    client_max_body_size 32k;
    # Avoid persisting query/filter text and application identifiers in access logs.
    access_log off;

    location / {
        proxy_pass http://127.0.0.1:5088;
        proxy_http_version 1.1;
        proxy_set_header Host hlcp.home.goffa.cz;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $hlcp_web_connection;
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
